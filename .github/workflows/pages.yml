name: Dashboard (GitHub Pages)

# Regenerates docs/data/dashboard.json (committee + submissions + approved registry)
# and publishes docs/ to GitHub Pages.
#
# Activation: the first run auto-enables Pages (configure-pages enablement: true),
# so merging this workflow to the default branch publishes the site. To stage the
# code without publishing, hold the merge or set enablement: false below.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily refresh
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/build-dashboard.mjs'
      - '.github/workflows/pages.yml'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: OIA matrix — auto-classify submissions & promote approvals
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          EVENT_DATE: ${{ github.event.issue.updated_at }}
        run: node scripts/oia-intake-step.mjs
      - name: Persist OIA matrix changes
        if: github.event_name == 'issues'
        run: |
          if [ -n "$(git status --porcelain docs/data/oia-matrix.json docs/badges)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/oia-matrix.json docs/badges
            git commit -m "oia-matrix: auto-update from issue #${{ github.event.issue.number }} [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push skipped (branch protection or race); deploy still reflects local tree"
          fi
      - name: Build dashboard.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-dashboard.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
