name: Dashboard (GitHub Pages)

# Regenerates docs/data/dashboard.json (committee + submissions + approved registry)
# and publishes docs/ to GitHub Pages.
#
# Activation: the first run auto-enables Pages (configure-pages enablement: true),
# so merging this workflow to the default branch publishes the site. To stage the
# code without publishing, hold the merge or set enablement: false below.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily refresh
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/build-dashboard.mjs'
      - '.github/workflows/pages.yml'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: OIA matrix — auto-classify submissions & promote approvals
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          EVENT_DATE: ${{ github.event.issue.updated_at }}
        run: node scripts/oia-intake-step.mjs
      # Concurrent submissions used to lose rows SILENTLY. Each `issues` event
      # checks out main, adds its row, and pushes. When two land seconds apart
      # (#51/#52/#53 on 2026-08-21, 26 seconds apart) the later push is rejected
      # non-fast-forward -- and the old `|| echo` swallowed the rejection, so the
      # job reported success with the row dropped on the floor. Two rows had to
      # be hand-carried back in via PRs #54/#56.
      #
      # Now: retry against a freshly fetched main, and FAIL LOUDLY if the row
      # still cannot be persisted. A green run must mean the row landed.
      #
      # This fixes root cause 1 of #57. Root cause 2 -- a single shared mutable
      # JSON array on the write path, which also causes PR-level textual
      # conflicts -- needs the per-entry-file redesign and remains OPEN.
      - name: Persist OIA matrix changes
        if: github.event_name == 'issues'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/data/oia-matrix.json docs/badges)" ]; then
            echo "no matrix change to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/oia-matrix.json docs/badges
          git commit -m "oia-matrix: auto-update from issue #${{ github.event.issue.number }} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "matrix row persisted on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt): another submission landed first"
            git fetch origin main
            if git rebase origin/main; then
              sleep $((attempt * 2))
              continue
            fi
            # Two appends to the same pending[] array conflict textually almost
            # every time (#57 root cause 2), so a rebase alone cannot recover the
            # row. Regenerate it instead: reset to the main that won, re-run the
            # classification (idempotent -- add-pending dedups by repo name), and
            # try again. OIA_SKIP_COMMENT stops the submitter being re-notified.
            echo "rebase conflicted on the shared pending[] array; regenerating the row against current main"
            git rebase --abort || true
            git reset --hard origin/main
            OIA_SKIP_COMMENT=1 node scripts/oia-intake-step.mjs
            if [ -z "$(git status --porcelain docs/data/oia-matrix.json docs/badges)" ]; then
              echo "row is already present on current main; nothing left to persist"
              exit 0
            fi
            git add docs/data/oia-matrix.json docs/badges
            git commit -m "oia-matrix: auto-update from issue #${{ github.event.issue.number }} [skip ci]"
            sleep $((attempt * 2))
          done
          echo "::error::OIA matrix row for issue #${{ github.event.issue.number }} could NOT be persisted after 5 attempts. This run did NOT classify the submission."
          exit 1
      - name: Build dashboard.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-dashboard.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
