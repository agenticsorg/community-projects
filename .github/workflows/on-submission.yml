name: On Submission

on:
  issues:
    # `labeled` is required: every downstream step is gated on
    # `status:pending-review`, and that label does not arrive with the `opened`
    # event. Firing on `labeled` too catches it whenever it lands; the guard +
    # idempotency check keep it single-run.
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  # The project-submission template declares labels: ["status:pending-review"],
  # but GitHub applies issue-form labels only for authors who already have
  # permission to label. Outside submitters do not, so the label is dropped
  # silently. RobLe3 diagnosed this on #51/#52/#53 on 2026-08-21: "GitHub
  # ignored the template label because the submitting account does not have
  # triage permission here."
  #
  # Confirmed against the issue events API 2026-09-22: on #44, #51, #52, #53 and
  # #55 the first `labeled` event is the chair applying it by hand, from 6
  # minutes to 2 days after creation (#44, the only outside submitter, waited two
  # days). Control: Dependabot's #33 carries a creation-time label event, so the
  # API does record them; their absence here is real.
  #
  # Consequence: intake was never self-service for the population it exists to
  # serve. Every submission sat inert until a human labelled it, because every
  # workflow here is gated on that label.
  #
  # So apply the label ourselves. This job recognises a submission by the
  # required headings the issue form renders, and adds `status:pending-review`,
  # which then fires the `labeled` event the rest of the pipeline listens for.
  # It does not classify, score, or decide anything (AF-GOV-002).
  autolabel:
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'opened' &&
      !contains(github.event.issue.labels.*.name, 'status:pending-review')
    steps:
      - name: Apply status:pending-review to a submission-form issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || '';

            // The two REQUIRED fields of the project-submission form. Both must
            // be present, so an ordinary issue that happens to mention a repo
            // URL is not mistaken for a submission.
            const REQUIRED_HEADINGS = ['### Repository URL', '### Submission Category'];
            const missing = REQUIRED_HEADINGS.filter(h => !body.includes(h));
            if (missing.length) {
              core.info(`Not a project-submission form issue (missing: ${missing.join(', ')}); leaving unlabelled.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['status:pending-review'],
            });
            core.info('Applied status:pending-review; the labeled event now drives intake.');

  triage:
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'status:pending-review') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'status:pending-review'))
    steps:
      - name: Extract category and apply label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || '';

            // Idempotency: `opened` and `labeled` can both fire for one submission.
            // If the automated welcome is already posted, do nothing.
            const WELCOME_MARKER = 'automated message from the Agentics Foundation Open Source Committee intake system';
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (existing.some(c => (c.body || '').includes(WELCOME_MARKER))) {
              core.info('Welcome already posted; skipping (idempotent).');
              return;
            }

            // SEC-007: Sanitize user input before embedding in comments
            function sanitize(input, maxLen = 100) {
              return input
                .replace(/[[\](){}|`*_~#>!\\]/g, '')
                .substring(0, maxLen)
                .trim();
            }

            // Extract category from the issue form
            const categoryMap = {
              'Project Donation': 'category:donation',
              'Website Listing': 'category:website-listing',
              'Co-Founder Search': 'category:cofounder',
              'Problem Support': 'category:support',
              'Contributor Engagement': 'category:contributors'
            };

            let categoryLabel = null;
            for (const [text, label] of Object.entries(categoryMap)) {
              if (body.includes(text)) {
                categoryLabel = label;
                break;
              }
            }

            // Apply category label
            if (categoryLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [categoryLabel]
              });
            }

            // Extract submitter name
            const nameMatch = body.match(/### Full Name\s*\n\s*(.+)/);
            const name = sanitize(nameMatch ? nameMatch[1].trim() : 'there');

            // Post welcome comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Thank you for your submission, ${name}!`,
                '',
                'Your project has been received and is now **pending review** by the Open Source Committee.',
                '',
                '### What happens next',
                '',
                '1. Committee members will review your submission and score it using the [scoring rubric](../blob/main/docs/scoring-template.md)',
                '2. The committee will vote on whether to escalate to senior leadership',
                '3. If not escalated, a validation vote will determine approval, deferral, or decline',
                '4. You will be notified of the outcome',
                '',
                'If you need to update your submission, please edit the issue description above.',
                '',
                '---',
                '*This is an automated message from the Agentics Foundation Open Source Committee intake system.*'
              ].join('\n')
            });
